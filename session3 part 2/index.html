<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <section class="left section" >
            <div class="container">
                <div class="card">
                    <h1>Let's Chat</h1>
                    <p> Whether you have a question ,want to start a project or simply want to connect .</p>
                    <br>
                    <p> Feel free to send me a message in the contact form .</p>
                </div>
                <div class="form">
                    <h1><b> Contact </b> </h1>
                    <form method="post">
                        <label for=""> *required </label>
                        <div class="inputs">
                            <input name=" name " type="text" maxlength="20" placeholder="Name*" required>
                        </div>
        
                        <div class="inputs">
                            <input name="email" type="email" placeholder="Email*" pattern="[a-zA-Z0,9,_%+-]+@" required>
                        </div>
                        <div class="inputs">
                            <input name="company" type="text" placeholder="company" required>
                        </div>
                        <div class="inputs">
                            <input name="Phone" required placeholder="Phone">
                        </div>
                        <div class="inputs">
                            <textarea type="text" name="comment" rows="5" cols="40" placeholder="Message"></textarea>
                        </div>
                        <input type="submit">
                    
                    </form>
                </div> 
            </div>


        </section>
    </body>
</html>
